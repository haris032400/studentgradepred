<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f4f9;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            background: #fff;
            margin: auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #ccc;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        .result {
            background: #e6ffe6;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
        .probabilities {
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📘 Student Grade Predictor</h2>
        <form method="POST" action="/predict">
            <label for="quiz">Quiz Score(out of 10):</label>
            <input type="number" name="quiz" step="any" required>

            <label for="participation">Class Participation Score(out of 10):</label>
            <input type="number" name="participation" step="any" required>

            <label for="attendance">Attendance Score(out of 10):</label>
            <input type="number" name="attendance" step="any" required>

            <input type="submit" value="Predict Grade">
        </form>

        {% if prediction %}
        <div class="result">
            <h3>🎓 Predicted Grade: {{ prediction }}</h3>
            
        </div>
        {% endif %}
    </div>
</body>
</html>
